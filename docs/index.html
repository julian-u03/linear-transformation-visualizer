<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linear Transformation Visualizer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=restore-1">
  <script type="module" src="./main.js?v=restore-1"></script>
</head>
<body>
  <header>
    <h1>Linear Transformation Visualizer</h1>
    <p id="status" role="status">Loading Python…</p>
    <button id="retry" hidden>Retry Python</button>
  </header>
  <aside>
    <section class="matrix-panel">
      <h2>Matrices</h2>
      <div id="matrix-list"></div>
      <div class="actions">
        <button id="new-matrix" data-compute>New matrix</button>
        <button id="remove-matrix" data-compute disabled>Remove</button>
      </div>
      <form id="matrix-form">
        <label for="matrix-input">Matrix entries (one row per line)</label>
        <textarea id="matrix-input" rows="3" spellcheck="false">1 0
0 1</textarea>
        <button id="apply" type="submit" data-compute>Apply as new matrix</button>
      </form>
      <p id="matrix-error" class="error" role="alert"></p>
      <p id="mapping"></p>
    </section>
    <section class="view-panel">
      <h2>View</h2>
      <div class="actions" aria-label="Camera presets">
        <button id="view-xy">XY view</button>
        <button id="view-xz">XZ view</button>
        <button id="view-yz">YZ view</button>
      </div>
      <label class="check"><input id="transformed-grid" type="checkbox" checked> Transformed grids</label>
      <label class="check"><input id="points" type="checkbox"> Points</label>
      <label class="check"><input id="basis" type="checkbox" checked> Basis vectors and images</label>
      <div class="actions">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="reset-view">Reset view</button>
      </div>
      <p class="hint">Drag to rotate. Scroll to zoom.</p>
    </section>
  </aside>
  <main>
    <div class="plot">
      <svg id="space" viewBox="-400 -400 800 800" role="img" aria-label="Shared source and transformed coordinate view"></svg>
      <div class="legend">
        <span><i class="original"></i> Source vector v</span>
        <span><i></i> Grid / transformed vector</span>
        <span id="points-legend" hidden><i class="points"></i> Points: gray source / colored image</span>
      </div>
      <p id="space-label"></p>
    </div>
    <section class="animation-panel" aria-labelledby="animation-title">
      <h2 id="animation-title">Animation</h2>
      <div class="animation-controls">
        <div><label for="animation-from">From</label><select id="animation-from" data-animation><option value="identity">Identity</option></select></div>
        <div><label for="animation-to">To</label><select id="animation-to" data-animation><option value="identity">Identity</option></select></div>
        <div><label for="animation-seconds">Seconds</label><input id="animation-seconds" type="number" min="0.1" step="any" value="3"></div>
        <button id="animation-play" data-animation>Play</button>
      </div>
      <div class="animation-progress">
        <input id="animation-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Animation progress" data-animation>
        <output id="animation-percent" for="animation-progress">0%</output>
      </div>
      <p id="animation-context" class="hint" role="status">Waiting for Python.</p>
      <p id="animation-error" class="error" role="alert"></p>
    </section>
  </main>
  <section class="vector-panel">
    <h2>Vectors</h2>
    <label for="source-dimension">Source dimension</label>
    <select id="source-dimension">
      <option value="1">R¹</option>
      <option value="2" selected>R²</option>
      <option value="3">R³</option>
    </select>
    <p id="vector-context"></p>
    <form id="vector-form">
      <div id="coordinates" class="coordinates"></div>
      <div class="actions">
        <button id="save-vector" type="submit" data-compute>Add vector</button>
        <button id="new-vector" type="button">New vector</button>
      </div>
    </form>
    <p id="vector-error" class="error" role="alert"></p>
    <div id="vector-list"></div>
    <div id="animation-vector" class="readouts" aria-label="Animated vector coordinates"></div>
    <div class="actions" id="vector-pages" hidden>
      <button id="previous-vector" aria-label="Previous vector">←</button>
      <span id="vector-page"></span>
      <button id="next-vector" aria-label="Next vector">→</button>
    </div>
    <button id="clear-vectors" data-compute>Clear all vectors</button>
  </section>
  <script>
    if (location.protocol === "file:") {
      document.getElementById("status").textContent = "Open this page through a local HTTP server. Python workers cannot run from file:// URLs.";
    }
    document.querySelector('script[type="module"]').addEventListener("error", () => {
      if (location.protocol !== "file:") document.getElementById("status").textContent = "Could not load the application files. Reload this page through your HTTP server.";
    });
  </script>
</body>
</html>
